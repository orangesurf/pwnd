name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: swift test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Builds every target (app, pwnd-scan, PwndCore, tests), so a compile
      # error in the app or the CLI fails here too, not only in PwndCore.
      - name: Build all targets
        run: swift build --build-tests

      - name: Run tests
        run: swift test --skip-build --parallel
